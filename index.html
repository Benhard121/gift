<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="flowers.png" type="image/x-icon">
    <title>XIELL | Midnight Frequencies</title>
</head>
<body>
    <audio id="bg-music" src="music.mp3" loop></audio>

    <div class="desktop-mockup">
        <!-- Page 1: Landing Page -->
        <div class="page page-1 active" id="page-1">
            <div class="bg-layer"></div>
            <div class="particles-container" id="particles-1"></div>

            <!-- Hiasan pendukung: kabut tambahan -->
            <div class="mist-layer mist-1"></div>
            <div class="mist-layer mist-2"></div>

            <!-- Siluet pohon dan bangunan Jepang -->
            <div class="japanese-scene">
                <div class="tree-silhouette tree-left"></div>
                <div class="tree-silhouette tree-center"></div>
                <div class="tree-silhouette tree-right"></div>
                <div class="pagoda-silhouette"></div>
                <div class="lantern lantern-left"></div>
                <div class="lantern lantern-right"></div>
            </div>

            <div class="audio-toggle" id="audio-toggle">
                <span class="audio-icon">🔊</span>
            </div>

            <div class="enter-content">
                <h1 class="glow-text" id="enter-text">CLICK TO ENTER...</h1>
            </div>
        </div>

        <!-- Page 2: Main Profile Page -->
        <div class="page page-2" id="page-2">
            <div class="bg-layer"></div>
            <div class="particles-container" id="particles-2"></div>

            <!-- Hiasan pendukung: kabut tambahan -->
            <div class="mist-layer mist-1"></div>
            <div class="mist-layer mist-2"></div>

            <!-- Siluet pohon dan bangunan Jepang -->
            <div class="japanese-scene">
                <div class="tree-silhouette tree-left"></div>
                <div class="tree-silhouette tree-center"></div>
                <div class="tree-silhouette tree-right"></div>
                <div class="pagoda-silhouette"></div>
                <div class="lantern lantern-left"></div>
                <div class="lantern lantern-right"></div>
            </div>

            <div class="audio-toggle" id="audio-toggle-2">
                <span class="audio-icon">🔊</span>
            </div>

            <div class="viewer-count">
                <span>👁</span> <span class="viewer-number">206</span>
            </div>

            <div class="profile-card">
                <div class="profile-avatar">
                    <img src="anime-girl-white-scarf-monochrome.webp" alt="Profile">
                    <div class="halo"></div>
                </div>
                <h1 class="profile-name">XIELL</h1>
                <p class="profile-status">Even the sky feels empty.</p>
                <div class="profile-location">
                    <span>📍</span> Midnight Frequencies
                </div>

                <div class="activity-card">
                    <div class="activity-avatar">
                        <img src="anime-girl-white-scarf-monochrome.webp" alt="Activity">
                    </div>
                    <div class="activity-info">
                        <div class="activity-name">xiellll_ 🖤 down</div>
                        <div class="activity-time">last seen 1 hour ago</div>
                    </div>
                    <div class="activity-badge">
                        <span class="green-dot"></span>
                        <span>dove</span>
                    </div>
                </div>

                <div class="social-icons">
                    <a href="#" class="social-icon" title="Discord">🎮</a>
                    <a href="#" class="social-icon" title="Instagram">📷</a>
                    <a href="#" class="social-icon" title="Roblox">🧱</a>
                    <a href="#" class="social-icon" title="GitHub">🐙</a>
                    <a href="#" class="social-icon" title="TikTok">🎵</a>
                </div>
            </div>

            <div class="music-player">
                <div class="album-thumb"></div>
                <div class="music-info">
                    <div class="song-title">Where I?</div>
                    <div class="progress-container">
                        <span class="time-current">0:02</span>
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <span class="time-total">0:24</span>
                    </div>
                </div>
                <div class="music-controls">
                    <button class="control-btn" title="Previous">⏮</button>
                    <button class="control-btn pause-btn" title="Pause">⏸</button>
                    <button class="control-btn" title="Next">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
