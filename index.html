<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="flowers.png" type="image/x-icon">
    <title>XIELL | Halaman Masuk</title>
</head>
<body>
    <audio id="bg-music" src="music.mp3" loop></audio>

    <div class="desktop-mockup page-1">
        <div class="bg-layer"></div>
        <div class="particles-container" id="particles-1"></div>

        <!-- Hiasan pendukung: kabut tambahan -->
        <div class="mist-layer mist-1"></div>
        <div class="mist-layer mist-2"></div>

        <!-- Siluet pohon dan bangunan Jepang -->
        <div class="japanese-scene">
            <div class="tree-silhouette tree-left"></div>
            <div class="tree-silhouette tree-center"></div>
            <div class="tree-silhouette tree-right"></div>
            <div class="pagoda-silhouette"></div>
            <div class="lantern lantern-left"></div>
            <div class="lantern lantern-right"></div>
        </div>

        <div class="audio-toggle" id="audio-toggle">
            <span class="audio-icon">🔊</span>
        </div>

        <div class="enter-content">
            <h1 class="glow-text" id="enter-text">CLICK TO ENTER...</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
